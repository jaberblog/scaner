<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>اسکنر بارکد حرفه‌ای</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .scan-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .scan-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 12px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .result-format {
            color: #764ba2;
            font-size: 12px;
            margin-top: 5px;
        }

        .clear-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #ddd;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .history {
            margin-top: 20px;
            padding: 15px;
            background: #fafafa;
            border-radius: 12px;
        }

        .history-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px;
            background: white;
            margin-bottom: 5px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .history-code {
            flex: 1;
            word-break: break-all;
            margin-left: 10px;
        }

        .history-format {
            color: #764ba2;
            font-size: 10px;
            padding: 2px 6px;
            background: #f0f0f0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 اسکنر 1</h1>
    <div class="subtitle">بارکدهای خطی (Code 128، EAN-13، Code 39 و ...)</div>

    <button class="scan-btn" onclick="startScan()">
        📷 شروع اسکن
    </button>

    <div class="result-box" id="resultBox">
        <div class="result-label">نتیجه اسکن:</div>
        <div class="result-value" id="resultValue">-</div>
        <div class="result-format" id="resultFormat">نوع: -</div>
        <button class="clear-btn" onclick="clearResult()">پاک کردن</button>
    </div>

    <div class="history" id="historyBox" style="display:none;">
        <div class="history-title">تاریخچه اسکن‌ها:</div>
        <div class="history-list" id="historyList"></div>
    </div>
</div>

<script>
    let scanHistory = [];

    // تابع فراخوانی اسکنر اندروید
    function startScan() {
        if (typeof AndroidBarcode !== 'undefined') {
            AndroidBarcode.scanBarcode();
        } else {
            alert('اسکنر آماده نیست. لطفا برنامه را مجدد اجرا کنید.');
        }
    }

    // تابع دریافت نتیجه از اندروید
    function onBarcodeScanned(barcode, format) {
        console.log('بارکد اسکن شد:', barcode);
        console.log('فرمت:', format);

        // نمایش نتیجه
        document.getElementById('resultValue').innerText = barcode;
        document.getElementById('resultFormat').innerHTML = `نوع: ${getFormatName(format)}`;
        document.getElementById('resultBox').classList.add('show');

        // اضافه به تاریخچه
        addToHistory(barcode, format);

        // ویبره (اگر پشتیبانی کنه)
        if (navigator.vibrate) {
            navigator.vibrate(200);
        }

        // اینجا میتونی هر کاری که میخوای با بارکد انجام بدی
        // مثلاً ارسال به سرور، جستجو در دیتابیس و ...
    }

    function getFormatName(format) {
        const formats = {
            'CODE_128': 'Code 128',
            'CODE_39': 'Code 39',
            'CODE_93': 'Code 93',
            'EAN_13': 'EAN-13',
            'EAN_8': 'EAN-8',
            'UPC_A': 'UPC-A',
            'UPC_E': 'UPC-E',
            'CODABAR': 'Codabar',
            'ITF': 'ITF (Interleaved 2 of 5)'
        };
        return formats[format] || format;
    }

    function addToHistory(code, format) {
        scanHistory.unshift({ code: code, format: format, time: new Date() });
        if (scanHistory.length > 10) scanHistory.pop();

        updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
        const historyBox = document.getElementById('historyBox');
        const historyList = document.getElementById('historyList');

        if (scanHistory.length > 0) {
            historyBox.style.display = 'block';
            historyList.innerHTML = scanHistory.map(item => `
                <div class="history-item">
                    <span class="history-format">${getFormatName(item.format)}</span>
                    <span class="history-code">${item.code}</span>
                </div>
            `).join('');
        }
    }

    function clearResult() {
        document.getElementById('resultBox').classList.remove('show');
        document.getElementById('resultValue').innerText = '-';
    }

    // چک کردن وجود AndroidBarcode
    window.onload = function() {
        if (typeof AndroidBarcode === 'undefined') {
            console.warn('AndroidBarcode پیدا نشد');
        } else {
            console.log('AndroidBarcode آماده است');
        }
    }
</script>
</body>
</html>
